name: Build and Deploy Site

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Validate HTML
        uses: Cyb3r-Jak3/html5validator-action@v7.2.0
        with:
          root: dist
          extra: --ignore-re "require-trusted-types-for"

      - name: Check for broken internal links
        run: |
          set -e
          fail=0
          while IFS= read -r -d '' f; do
            while read -r link; do
              [ -z "$link" ] && continue
              path="${link%%#*}"
              [ -z "$path" ] && continue
              target="dist${path}"
              if [ ! -f "$target" ] && [ ! -f "${target%/}/index.html" ]; then
                echo "Broken link in $f -> $link"
                fail=1
              fi
            done < <(grep -oE 'href="/[^"]*"' "$f" | sed -E 's/href="([^"]*)"/\1/' | sort -u)
          done < <(find dist -name '*.html' -print0)
          exit $fail

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
